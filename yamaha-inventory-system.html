<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MML Inventory Control Tower</title>
<link rel="icon" type="image/png" href="yamaha-badge.png?v=20260723g">
<link rel="shortcut icon" type="image/png" href="yamaha-badge.png?v=20260723g">
<style>
:root{
  --yamaha-red:#ed1c24;
  --yamaha-red-dark:#b91018;
  --yamaha-navy:#0b1118;
  --yamaha-mirage:#1b242c;
  --yamaha-blue:#004b93;
  --yamaha-blue2:#0978c9;
  --yamaha-silver:#b5b7b6;
  --yamaha-ice:#f5f7fa;
  --yamaha-white:#ffffff;
  --ink:#08192b;
  --muted:#607086;
  --line:#d8e0ea;
  --panel:#ffffff;
  --shadow:0 18px 45px rgba(11,17,24,.12);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%,rgba(237,28,36,.10),transparent 30%),
    linear-gradient(135deg,#eef3f8 0%,#f7f9fc 45%,#ffffff 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.07;
  background:
    repeating-linear-gradient(135deg,transparent 0 18px,var(--yamaha-mirage) 18px 19px,transparent 19px 36px),
    linear-gradient(90deg,transparent 0 70%,var(--yamaha-red) 70% 70.35%,transparent 70.35% 100%);
  z-index:-1;
}
header{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(105deg,var(--yamaha-navy) 0%,var(--yamaha-mirage) 48%,#101923 100%);
  color:var(--yamaha-white);
  padding:22px 28px 24px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  border-bottom:4px solid var(--yamaha-red);
}
header:before{
  content:"";
  position:absolute;
  top:-80px;
  right:-90px;
  width:360px;
  height:260px;
  transform:rotate(-18deg);
  background:linear-gradient(90deg,transparent 0 30%,rgba(237,28,36,.90) 30% 42%,transparent 42% 100%);
  opacity:.85;
}
header:after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  height:1px;
  width:100%;
  background:linear-gradient(90deg,var(--yamaha-red),var(--yamaha-silver),transparent);
}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand-lockup{display:flex;align-items:center;gap:16px}
.brand-logo-img{
  width:210px;
  max-width:26vw;
  height:auto;
  display:block;
  object-fit:contain;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.32));
  background:#fff;
  border-radius:12px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.55);
}
@media(max-width:700px){.brand-logo-img{width:170px;max-width:60vw}}
.brand-logo-icon{
  width:64px;
  height:64px;
  display:block;
  border-radius:50%;
  box-shadow:0 8px 18px rgba(0,0,0,.32);
  border:2px solid rgba(255,255,255,.55);
  background:#fff;
  object-fit:cover;
}
@media(max-width:700px){.brand-logo-icon{width:52px;height:52px}}

.brand-emblem{
  width:54px;height:54px;border-radius:50%;
  border:2px solid rgba(255,255,255,.76);
  background:radial-gradient(circle at 50% 50%,#ffffff 0 7%,transparent 8% 100%),linear-gradient(145deg,var(--yamaha-red),#7c0710);
  box-shadow:0 0 0 7px rgba(237,28,36,.18), inset 0 0 18px rgba(255,255,255,.20);
  position:relative;flex:0 0 auto;
}
.brand-emblem:before,.brand-emblem:after{content:"";position:absolute;left:50%;top:50%;width:34px;height:3px;background:#fff;border-radius:999px;transform-origin:left center;box-shadow:0 0 5px rgba(255,255,255,.8)}
.brand-emblem:before{transform:rotate(30deg) translate(-8px,-1px)}
.brand-emblem:after{transform:rotate(150deg) translate(-8px,-1px)}
.brand-spoke{position:absolute;left:50%;top:50%;width:34px;height:3px;background:#fff;border-radius:999px;transform-origin:left center;transform:rotate(270deg) translate(-8px,-1px);box-shadow:0 0 5px rgba(255,255,255,.8)}
h1{margin:0;font-size:28px;letter-spacing:.3px;text-transform:uppercase;font-weight:900;line-height:1.05}.brand-word{color:#fff}.brand-word span{color:var(--yamaha-red)}
.small{opacity:.86;margin-top:6px;letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:700;color:#d7dee8}.badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-left:5px solid var(--yamaha-red);border-radius:16px;padding:10px 14px;font-size:13px;box-shadow:inset 0 0 20px rgba(255,255,255,.04);backdrop-filter:blur(8px)}
.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 104px)}
nav{background:linear-gradient(180deg,#0a0f15,var(--yamaha-mirage));padding:18px 12px;border-right:1px solid rgba(255,255,255,.07);box-shadow:10px 0 30px rgba(12,21,35,.12)}
nav button{display:block;width:100%;margin:0 0 12px;padding:13px 14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.05);color:#e9eef5;text-align:left;font-weight:800;letter-spacing:.02em;cursor:pointer;position:relative;overflow:hidden;transition:.18s ease}
nav button:before{content:"";position:absolute;left:0;top:0;height:100%;width:4px;background:transparent;transition:.18s ease}nav button.active,nav button:hover{background:linear-gradient(90deg,rgba(237,28,36,.95),rgba(237,28,36,.25));color:#fff;transform:translateX(2px);box-shadow:0 9px 20px rgba(237,28,36,.18)}nav button.active:before,nav button:hover:before{background:#fff}
.content{padding:24px;overflow:auto}.panel{background:rgba(255,255,255,.94);border:1px solid rgba(181,183,182,.55);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;backdrop-filter:blur(8px)}.panel h2{margin-top:0;color:#071526;font-size:22px}.notice{border-left:5px solid var(--yamaha-red);background:linear-gradient(90deg,#fff6f6,#f1f7ff);padding:13px 15px;border-radius:14px;margin:12px 0;color:#19314f}.notice.ok{border-left-color:#0baa66;background:linear-gradient(90deg,#eefcf5,#f6fbff)}.notice.bad{border-left-color:var(--yamaha-red);background:#fff1f1}.grid3{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px}.drop{border:2px dashed rgba(27,36,44,.25);border-radius:18px;background:linear-gradient(180deg,#fff,#f7f9fc);padding:18px;min-height:176px;position:relative;overflow:hidden}.drop:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--yamaha-red),var(--yamaha-blue2))}.drop b{font-size:15px}.hint{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:13px 0}.btn,button{border:0;border-radius:13px;background:linear-gradient(180deg,#334155,#1f2937);color:white;padding:10px 15px;font-weight:800;cursor:pointer;box-shadow:0 7px 14px rgba(15,23,42,.14);transition:.16s ease}.btn:hover,button:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn.green{background:linear-gradient(180deg,#16a86d,#08784d)}.btn.danger{background:linear-gradient(180deg,#ef4444,#b91c1c)}.btn.secondary{background:linear-gradient(180deg,#3b485a,#1f2937)}.btn.mini{padding:4px 8px;font-size:11px}input,select{border:1px solid #c5d1df;border-radius:13px;padding:10px 12px;background:#fff;min-width:180px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}input:focus,select:focus{outline:3px solid rgba(237,28,36,.18);border-color:var(--yamaha-red)}.inv-scroll{overflow:auto;border:1px solid var(--line);border-radius:16px;background:white;max-height:65vh;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}.inv-grid{display:block}.inv-head,.inv-row{display:grid;border-bottom:1px solid var(--line)}.inv-th{position:sticky;top:0;background:linear-gradient(180deg,#101923,#1b242c);color:#fff;font-weight:900;text-transform:uppercase;font-size:12px;padding:11px 10px;border-bottom:3px solid var(--yamaha-red);cursor:pointer;letter-spacing:.03em}.inv-td{padding:9px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inv-row:nth-child(odd){background:#fbfcfe}.inv-row:hover{background:#fff5f5}.pill{border-radius:999px;padding:4px 9px;font-weight:900;font-size:11px}.pill.used{background:#fee2e2;color:#991b1b}.pill.stock{background:#dcfce7;color:#166534}.pill.new{background:#e0f2fe;color:#075985}.empty{border:1px dashed #b7c5d6;border-radius:18px;padding:30px;text-align:center;background:#fbfdff}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi{background:linear-gradient(180deg,#fff,#f6f8fb);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 8px 18px rgba(15,23,42,.06)}.kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.05em}.kpi .value{font-size:26px;font-weight:900;margin-top:6px;color:#0a1726}footer{color:var(--muted);font-size:12px;padding:14px}.successModal,#loadingOverlay{position:fixed;inset:0;background:rgba(3,7,18,.72);display:none;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(5px)}.successCard,.loader-card{background:white;padding:30px;border-radius:22px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.42);min-width:350px;border-top:5px solid var(--yamaha-red)}.successIcon{font-size:44px;color:#0baa66}.successBtn{background:linear-gradient(180deg,#16a86d,#08784d)}.loader-title{font-weight:900;text-transform:uppercase;letter-spacing:.06em}.loader-bar,.parser-bar{height:13px;background:#dbe2ec;border-radius:999px;overflow:hidden;margin:16px 0;position:relative}.loader-fill,.parser-fill{height:100%;width:55%;background:linear-gradient(90deg,var(--yamaha-red),#fff,var(--yamaha-blue2));animation:yLead 1.15s infinite ease-in-out;border-radius:999px}@keyframes yLead{0%{transform:translateX(-110%)}100%{transform:translateX(210%)}}.parser-loader{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.parser-pulse{font-weight:900;color:var(--yamaha-red);text-transform:uppercase;letter-spacing:.06em}@media(max-width:1100px){.layout{grid-template-columns:1fr}nav{display:flex;gap:8px;overflow:auto}nav button{min-width:175px}.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}

.logo-fallback{
  width:210px;
  max-width:26vw;
  min-height:40px;
  display:none;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#ed1c24;
  border-radius:12px;
  padding:8px 14px;
  font-weight:1000;
  letter-spacing:.08em;
  font-size:27px;
  line-height:1;
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 8px 18px rgba(0,0,0,.32);
}
@media(max-width:700px){.logo-fallback{width:170px;max-width:60vw;font-size:22px}}
</style>
</head>
<body>
<div id="successModal" class="successModal"><div class="successCard"><div class="successIcon">✓</div><h2>Inventory Generated Successfully</h2><div id="successInfo">Generation Complete</div><br><button class="successBtn" onclick="closeSuccessAndView()">View Inventory</button></div></div>
<div id="loadingOverlay"><div class="loader-card"><div class="loader-title">Processing Inventory Data</div><div class="loader-bar"><div class="loader-fill"></div></div><div class="loader-text">Loading records, applying filters, sorting data and preparing table view...</div></div></div>
<header><div class="top"><div class="brand-lockup"><img src="yamaha-title-logo.jpg" class="brand-logo-img" alt="Yamaha Motor Logo"><div><h1>MML INVENTORY CONTROL TOWER</h1><div class="small">MML Inventory System</div></div></div><div class="badge" id="stamp">No generated data</div></div></header>
<div class="layout"><nav id="nav"><button data-v="upload" class="active" onclick="show('upload')">Upload & Generate</button><button data-v="inhouse" onclick="show('inhouse')">In-House Inventory</button><button data-v="koike" onclick="show('koike')">KOIKE Inventory</button><button data-v="toll" onclick="show('toll')">Toll Global Inventory</button><button data-v="settings" onclick="show('settings')">Export & Settings</button></nav>
<main class="content"><section id="upload" class="view"></section><section id="inhouse" class="view" hidden></section><section id="koike" class="view" hidden></section><section id="toll" class="view" hidden></section><section id="settings" class="view" hidden></section><section id="dash" class="view" hidden></section><footer>Design and Code by Muhammad Arif</footer></main></div>
<script>
// ==================== APPLICATION STATE ====================
const AppState={files:{toll:[],koike:[],line:[],line123:[]},db:null,sort:{},showAll:false,inhousePage:1,inhousePageSize:5000};
const MAX_FILE_SIZE=1024*1024*1024;// 1GB limit
// Pre-compiled regex patterns for better performance
const REGEX_VENDOR=/YMCN|YIMM|YMVN|TYM|IYM|YMC/i;
const REGEX_CONTAINER_VENDOR=/-\s*([A-Z0-9]+)\s*-(?:\s*[A-Z]+)?\s*LINE\s*(\d+)/i;
const SAFETY_RULES={strict:true,clearPhrase:'CLEAR ALL',regeneratePhrase:'REGENERATE'};
const SAFETY_BACKUP_KEY='yamaha-inventory-latest-backup';
// ==================== UTILITY FUNCTIONS ====================
/**
 * Creates an empty database structure
 * @returns {Object} Empty database with containers, movements, lineCases arrays
 */
function emptyDB(){return{containers:[],movements:[],lineCases:[],sources:[],generatedAt:null}}
AppState.db=emptyDB();
/**
 * Shows the success modal with generation summary
 */
function showSuccessPrompt(){var s=summary();document.getElementById('successInfo').innerHTML='Records Loaded: '+fmt(s.lineCases)+'<br>Containers: '+fmt(s.containers)+'<br>Generated: '+AppState.db.generatedAt;document.getElementById('successModal').style.display='flex';}
/**
 * Closes success modal and navigates to inhouse view
 */
function closeSuccessAndView(){document.getElementById('successModal').style.display='none';show('inhouse');}
/**
 * Updates generation progress bar (used during file processing)
 * @param {number} p - Progress percentage (0-100)
 * @param {string} msg - Status message to display
 */
function updateGenProgress(p,msg){var b=document.getElementById('gpBar');var s=document.getElementById('gpStatus');var pct=document.getElementById('gpPct');if(b)b.style.width=p+'%';if(s)s.textContent=msg||'Processing';if(pct)pct.textContent=Math.round(p)+'%';}
/**
 * Shows the loading overlay with an optional message
 * @param {string} msg - Optional message to display
 */
function showLoader(msg){var o=document.getElementById("loadingOverlay");if(o){o.style.display="flex";if(msg){var t=o.querySelector(".loader-text");if(t)t.textContent=msg;}}}
/**
 * Hides the loading overlay
 */
function hideLoader(){var o=document.getElementById("loadingOverlay");if(o)o.style.display="none";}
function safetyLog(msg){var log=document.getElementById('log');if(log)log.innerHTML='<div class="notice bad"><b>Safety rule:</b> '+esc(msg)+'</div>';}
function createSafetyBackup(reason){
  if(!hasData())return true;
  try{
    localStorage.setItem(SAFETY_BACKUP_KEY,JSON.stringify({reason:reason||'manual',savedAt:new Date().toISOString(),db:AppState.db}));
    return true;
  }catch(e){
    safetyLog('Backup failed. Destructive action is blocked to protect your data.');
    return false;
  }
}
function requireSafetyConfirmation(actionLabel,phrase){
  if(!SAFETY_RULES.strict)return true;
  var input=window.prompt(actionLabel+' confirmation required. Type "'+phrase+'" to continue.','');
  if(input!==phrase){safetyLog(actionLabel+' cancelled. Confirmation text did not match.');return false;}
  return true;
}
// Global error handler
window.addEventListener('error',function(e){var log=document.getElementById('log');if(log){log.innerHTML='<div class="notice bad"><b>Script error:</b> '+(e.message||'Unknown error')+'</div>';}});
// Single event listener for all button clicks to show loader (consolidated from 4 duplicate listeners)
document.addEventListener("click",function(e){if(e.target.closest("button")){showLoader("Updating inventory view...");setTimeout(hideLoader,300);}});
/**
 * Checks if there is any loaded data
 * @returns {boolean} True if database contains data
 */
function hasData(){return AppState.db.containers.length+AppState.db.movements.length+AppState.db.lineCases.length>0}
function fmt(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clean(x){return String(x??'').trim()}
function num(x){return Number(String(x??'0').replace(/,/g,''))||0}
function norm(x){return clean(x).toLowerCase().replace(/\s+/g,' ')}
function dval(x){return clean(x)}
function fileKey(f){return [f.name,f.size,f.lastModified].join('|')}
function ensureXLSX(){return new Promise(function(resolve,reject){if(window.XLSX){resolve();return}var log=document.getElementById('log');if(log){log.innerHTML='<div class="parser-loader"><div class="parser-pulse">Preparing Inventory Engine</div><div style="font-size:13px;color:#64748b">Loading Excel Processing Library (XLSX Parser)</div><div class="parser-bar"><div class="parser-fill"></div></div><div style="font-size:12px;color:#64748b;margin-top:8px">Please wait while the inventory engine initializes...</div></div>'}var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=function(){resolve()};sc.onerror=function(){reject(new Error('Excel parser could not load. Download this HTML and open it locally in Edge/Chrome, then allow internet access for the parser.'))};document.head.appendChild(sc);});}
/**
 * Sets files for a given type with validation
 * @param {FileList} list - Files to upload
 * @param {string} type - File type category (toll, koike, line, line123)
 */
function setFiles(list,type){
  let incoming=Array.from(list||[]);
  // Validate file sizes (max 50MB per file)
  let oversized=incoming.filter(f=>f.size>MAX_FILE_SIZE).map(f=>f.name);
  if(oversized.length>0){
    var log=document.getElementById('log');
    if(log)log.innerHTML='<div class="notice bad"><b>File size error:</b> '+oversized.join(', ')+' exceed 1GB limit. Please use smaller files.</div>';
    return;
  }
  if(type==='line'||type==='line123'){
    let seen=new Set(AppState.files[type].map(fileKey));
    incoming.forEach(f=>{if(!seen.has(fileKey(f))){AppState.files[type].push(f);seen.add(fileKey(f))}})}
  else{AppState.files[type]=incoming}
  renderUpload()
}
function removeLineFile(type,i){AppState.files[type].splice(i,1);renderUpload()}
function clearType(type){AppState.files[type]=[];renderUpload()}
function noData(t){return`<div class="empty"><div><h2>${t}</h2><p class="hint">Upload the reports and click <b>Generate Inventory</b>. No uploaded data is displayed before generation.</p><button class="btn" onclick="show('upload')">Go to Upload</button></div></div>`}
function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));document.querySelectorAll('.view').forEach(x=>x.hidden=true);document.getElementById(v).hidden=false}
document.getElementById('nav').onclick=e=>{if(e.target.tagName==='BUTTON')show(e.target.dataset.v)};
function renderUpload(){let f=t=>AppState.files[t].map((x,i)=>(t==='line'||t==='line123')?`${esc(x.name)} <button class="btn secondary mini" onclick="removeLineFile('${t}',${i})">Remove</button>`:esc(x.name)).join('<br>')||'No file selected';document.getElementById('upload').innerHTML=`<div class="panel"><div style="display:flex;align-items:center;gap:14px;margin-bottom:16px"><img src="yamaha-badge.png" alt="Yamaha badge" style="width:44px;height:44px;display:block;border-radius:50%;border:1px solid #d8e0ea;background:#fff;object-fit:cover"><h2 style="margin:0">Upload & Generate Inventory</h2></div><div class="notice ok">Upload Excel Report from Line 4, Line 1,2,3 , KOIKE & Toll Global</div><div class="grid3"><div class="drop"><b>Toll Global IN/OUT</b><p class="hint">Sheets: INBOUND and OUTBOUND.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'toll')"><p class="hint">${f('toll')}</p></div><div class="drop"><b>Koike Incoming</b><p class="hint">Visible monthly sheets only. Hidden sheets are skipped.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'koike')"><p class="hint">${f('koike')}</p></div><div class="drop"><b>In-House Line 4</b><p class="hint">Multiple upload is enabled. Add Line 4 files such as YIMM, YMVN, TYM together or one by one.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'line');this.value=''"><div class="toolbar" style="margin:8px 0"><button class="btn secondary" onclick="clearType('line')">Clear Line 4 files</button></div><p class="hint"><b>Selected Line 4 files:</b><br>${f('line')}</p></div><div class="drop"><b>In-House Line 1,2,3</b><p class="hint">Upload Instant Warehouse Record files. Vendor is detected from filename/header: YIMM, VIETNAM/YMVN, TYM, INDIA/IYM, or CKD/YMC. These records appear as Line 1,2,3.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'line123');this.value=''"><div class="toolbar" style="margin:8px 0"><button class="btn secondary" onclick="clearType('line123')">Clear Line 1,2,3 files</button></div><p class="hint"><b>Selected Line 1,2,3 files:</b><br>${f('line123')}</p></div></div><div class="toolbar"><button class="btn green" onclick="generate()">Generate Inventory</button><button class="btn danger" onclick="clearAll()">Clear</button><button class="btn secondary" onclick="exportJSON()">Export JSON</button></div><div id="log" class="hint"></div><noscript><div class="notice bad">JavaScript is blocked. Download the HTML and open locally in Microsoft Edge or Chrome.</div></noscript></div>`}
async function generate(){
  showLoader("Generating inventory from uploaded files...");
  try{await ensureXLSX()}catch(e){document.getElementById('log').innerHTML='<div class="notice bad"><b>Excel parser not loaded:</b> '+e.message+'</div>';return}
  if(!AppState.files.toll.length&&!AppState.files.koike.length&&!AppState.files.line.length&&!AppState.files.line123.length){document.getElementById('log').innerHTML='<div class="notice bad">Select at least one report file.</div>';return}
  if(hasData()){
    if(!requireSafetyConfirmation('Regenerate inventory',SAFETY_RULES.regeneratePhrase)){hideLoader();return}
    if(!createSafetyBackup('regenerate')){hideLoader();return}
  }
  AppState.db=emptyDB();AppState.sort={};AppState.showAll=false;
  let msgs=[];let total=['toll','koike','line','line123'].reduce((a,t)=>a+AppState.files[t].length,0);let done=0;
  for(let type of ['toll','koike','line','line123'])for(let file of AppState.files[type]){
    updateGenProgress((done/Math.max(total,1))*100,'Reading '+file.name);
    try{
      let r=await readWorkbook(file,type);

}
function renderToll(){
  let el=document.getElementById('toll');
  if(!hasData()){el.innerHTML=noData('Toll Global inventory empty until generated');return}
  let q=el.querySelector('#tq')?.value||'';
  let st=el.querySelector('#tst')?.value||'';
  let statusMap=tollStatusMap();
  let rows=AppState.db.containers.filter(x=>x.warehouse==='Toll Global').map(function(x){return Object.assign({},x,{inventoryStatus:tollStatus(x,statusMap)})});
  if(st)rows=rows.filter(x=>x.inventoryStatus===st);
  rows=filter(rows,q);
  el.innerHTML=`<div class="panel"><h2>Toll Global Inventory</h2><div class="notice">Toll status uses movement ledger balance/closure: Open or positive balance = In Stock, Closed/zero balance = Used.</div><div class="toolbar"><select id="tst" onchange="renderToll()"><option value="">All status</option><option value="In Stock" ${st==='In Stock'?'selected':''}>In Stock</option><option value="Used" ${st==='Used'?'selected':''}>Used</option></select><input id="tq" placeholder="Search container, model, origin..." value="${esc(q)}" oninput="renderToll()"><button class="btn secondary" onclick="csvRows('toll-containers.csv',AppState.db.containers.filter(x=>x.warehouse==='Toll Global').map(x=>Object.assign({},x,{inventoryStatus:tollStatus(x,tollStatusMap())})))">Export TOLL CSV</button></div>${t(rows,[{k:'inventoryStatus',l:'Status',f:pill},{k:'containerNo',l:'Container'},{k:'dateArrive',l:'Arrive'},{k:'dateReceive',l:'Receive'},{k:'origin',l:'Origin'},{k:'m3',l:'M3'},{k:'boxQty',l:'Boxes'},{k:'sourceSheet',l:'Sheet'}],1000,'toll')}</div>`
}
function renderLedger(){let el=document.getElementById('ledger');if(!hasData()){el.innerHTML=noData('Movement ledger empty until generated');return}let q=el.querySelector('#mq')?.value||'';let rows=filter(AppState.db.movements,q);el.innerHTML=`<div class="panel"><h2>Movement Ledger</h2><div class="toolbar"><input id="mq" placeholder="Search invoice, model, container..." value="${esc(q)}" oninput="renderLedger()"><button class="btn secondary" onclick="csvRows('movements.csv',AppState.db.movements)">Export CSV</button></div>${t(rows,[{k:'date',l:'Date'},{k:'warehouse',l:'Warehouse'},{k:'containerNo',l:'Container'},{k:'invoiceNo',l:'Invoice'},{k:'caseMarkOrderNo',l:'Order/Case Mark'},{k:'model',l:'Model'},{k:'caseIn',l:'Case In'},{k:'caseOut',l:'Case Out'},{k:'balance',l:'Balance'},{k:'location',l:'Location'}],1000,'ledger')}</div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="panel"><h2>Export & System Settings</h2><div class="toolbar"><button class="btn secondary" onclick="csvRows('in-house-cases.csv',AppState.db.lineCases)">Export All In-House Cases CSV</button><button class="btn secondary" onclick="csvRows('containers.csv',AppState.db.containers)">Export Containers CSV</button><button class="btn secondary" onclick="csvRows('movements.csv',AppState.db.movements)">Export Movements CSV</button><button class="btn secondary" onclick="exportJSON()">Export JSON Backup</button><button class="btn danger" onclick="clearAll()">Clear Generated Data (Strict Rule)</button></div><p class="hint">Strict safety rule is active. Regenerate and Clear require exact confirmation text and automatic backup.</p></div>`}
function toCSV(rows){if(!rows.length)return'';let ks=Object.keys(rows[0]);return ks.join(',')+'\n'+rows.map(r=>ks.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(',')).join('\n')}
function download(n,t,mime='text/csv'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:mime}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
function csvRows(n,rows){download(n,toCSV(rows),'text/csv')}
function exportJSON(){download('yamaha-inventory-backup.json',JSON.stringify(AppState.db,null,2),'application/json')}
function clearAll(){
  if(!requireSafetyConfirmation('Clear generated data',SAFETY_RULES.clearPhrase))return;
  if(!createSafetyBackup('clear-all'))return;
  AppState.db=emptyDB();AppState.sort={};AppState.showAll=false;renderAll();hideLoader();show('upload')
}
function renderAll(){renderUpload();renderInhouse();renderKoike();renderToll();renderSettings()}
renderAll();hideLoader();
</script>
</body></html>
