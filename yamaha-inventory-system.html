<style>
:root{
  --yamaha-red:#ed1c24;
  --yamaha-red-dark:#b91018;
  --yamaha-navy:#0b1118;
  --yamaha-mirage:#1b242c;
  --yamaha-blue:#004b93;
  --yamaha-blue2:#0978c9;
  --yamaha-silver:#b5b7b6;
  --yamaha-ice:#f5f7fa;
  --yamaha-white:#ffffff;
  --ink:#08192b;
  --muted:#607086;
  --line:#d8e0ea;
  --panel:#ffffff;
  --shadow:0 18px 45px rgba(11,17,24,.12);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%,rgba(237,28,36,.10),transparent 30%),
    linear-gradient(135deg,#eef3f8 0%,#f7f9fc 45%,#ffffff 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.07;
  background:
    repeating-linear-gradient(135deg,transparent 0 18px,var(--yamaha-mirage) 18px 19px,transparent 19px 36px),
    linear-gradient(90deg,transparent 0 70%,var(--yamaha-red) 70% 70.35%,transparent 70.35% 100%);
  z-index:-1;
}
header{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(105deg,var(--yamaha-navy) 0%,var(--yamaha-mirage) 48%,#101923 100%);
  color:var(--yamaha-white);
  padding:22px 28px 24px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  border-bottom:4px solid var(--yamaha-red);
}
header:before{
  content:"";
  position:absolute;
  top:-80px;
  right:-90px;
  width:360px;
  height:260px;
  transform:rotate(-18deg);
  background:linear-gradient(90deg,transparent 0 30%,rgba(237,28,36,.90) 30% 42%,transparent 42% 100%);
  opacity:.85;
}
header:after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  height:1px;
  width:100%;
  background:linear-gradient(90deg,var(--yamaha-red),var(--yamaha-silver),transparent);
}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand-lockup{display:flex;align-items:center;gap:16px}
.brand-logo-img{
  width:210px;
  max-width:26vw;
  height:auto;
  display:block;
  object-fit:contain;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.32));
  background:#fff;
  border-radius:12px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.55);
}
@media(max-width:700px){.brand-logo-img{width:170px;max-width:60vw}}
.brand-logo-icon{
  width:64px;
  height:64px;
  display:block;
  border-radius:50%;
  box-shadow:0 8px 18px rgba(0,0,0,.32);
  border:2px solid rgba(255,255,255,.55);
  background:#fff;
  object-fit:cover;
}
@media(max-width:700px){.brand-logo-icon{width:52px;height:52px}}

.brand-emblem{
  width:54px;height:54px;border-radius:50%;
  border:2px solid rgba(255,255,255,.76);
  background:radial-gradient(circle at 50% 50%,#ffffff 0 7%,transparent 8% 100%),linear-gradient(145deg,var(--yamaha-red),#7c0710);
  box-shadow:0 0 0 7px rgba(237,28,36,.18), inset 0 0 18px rgba(255,255,255,.20);
  position:relative;flex:0 0 auto;
}
.brand-emblem:before,.brand-emblem:after{content:"";position:absolute;left:50%;top:50%;width:34px;height:3px;background:#fff;border-radius:999px;transform-origin:left center;box-shadow:0 0 5px rgba(255,255,255,.8)}
.brand-emblem:before{transform:rotate(30deg) translate(-8px,-1px)}
.brand-emblem:after{transform:rotate(150deg) translate(-8px,-1px)}
.brand-spoke{position:absolute;left:50%;top:50%;width:34px;height:3px;background:#fff;border-radius:999px;transform-origin:left center;transform:rotate(270deg) translate(-8px,-1px);box-shadow:0 0 5px rgba(255,255,255,.8)}
h1{margin:0;font-size:28px;letter-spacing:.3px;text-transform:uppercase;font-weight:900;line-height:1.05}.brand-word{color:#fff}.brand-word span{color:var(--yamaha-red)}
.small{opacity:.86;margin-top:6px;letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:700;color:#d7dee8}.badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-left:5px solid var(--yamaha-red);border-radius:16px;padding:10px 14px;font-size:13px;box-shadow:inset 0 0 20px rgba(255,255,255,.04);backdrop-filter:blur(8px)}
.layout{
  display:grid;
  grid-template-columns:600px 1fr;
  min-height:calc(100vh - 104px);
}
nav{
    background:#05080c;
    min-height:100%;
    padding:20px;
    border-right:2px solid rgba(237,28,36,.3);
}
nav button{display:block;width:100%;margin:0 0 12px;padding:13px 14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.05);color:#e9eef5;text-align:left;font-weight:800;letter-spacing:.02em;cursor:pointer;position:relative;overflow:hidden;transition:.18s ease}
nav button:before{content:"";position:absolute;left:0;top:0;height:100%;width:4px;background:transparent;transition:.18s ease}nav button.active,nav button:hover{background:linear-gradient(90deg,rgba(237,28,36,.95),rgba(237,28,36,.25));color:#fff;transform:translateX(2px);box-shadow:0 9px 20px rgba(237,28,36,.18)}nav button.active:before,nav button:hover:before{background:#fff}
.content{
    padding:24px;
    overflow:auto;
    background:#f7f9fc;
    min-height:100%;
}
.logo-fallback{
  width:210px;
  max-width:26vw;
  min-height:40px;
  display:none;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#ed1c24;
  border-radius:12px;
  padding:8px 14px;
  font-weight:1000;
  letter-spacing:.08em;
  font-size:27px;
  line-height:1;
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 8px 18px rgba(0,0,0,.32);
}
@media(max-width:700px){.logo-fallback{width:170px;max-width:60vw;font-size:22px}}
/* ===============================
   YAMAHA R1 TFT SPEEDOMETER
================================= */

.yamaha-speedometer{
    background:#05080c;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.speed-ring{
    width:520px;
    height:520px;
    border-radius:50%;
    position:relative;

    background:
      radial-gradient(circle at center,
      #111 0%,
      #0b1118 50%,
      #000 100%);

    border:10px solid #222;
    box-shadow:
      inset 0 0 80px rgba(237,28,36,.25),
      0 0 40px rgba(0,0,0,.6);
}

.speed-ring::before{
    content:"";
    position:absolute;
    inset:20px;
    border-radius:50%;

    border:8px solid transparent;
    border-top-color:#ed1c24;
    border-right-color:#ed1c24;

    transform:rotate(30deg);
}

.speed-ring::after{
    content:"";
    position:absolute;
    inset:35px;
    border-radius:50%;

    background:
      repeating-conic-gradient(
      from -140deg,
      #fff 0deg,
      #fff 2deg,
      transparent 2deg,
      transparent 8deg);

    -webkit-mask:
      radial-gradient(circle,
      transparent 62%,
      black 63%);
}

.speed-btn{
    width:110px;
    height:110px;
    border-radius:50%;
    border:3px solid #ed1c24;

    background:
      linear-gradient(180deg,#1c232c,#0b1118);

    color:white;
    position:absolute;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    font-weight:900;

    transition:.3s;
}

.speed-btn:hover,
.speed-btn.active{
    background:#ed1c24;
    transform:scale(1.05);
    box-shadow:
      0 0 30px rgba(237,28,36,.9);
}

.speed-btn span{
    font-size:30px;
}

.speed-btn small{
    margin-top:4px;
    font-size:11px;
    letter-spacing:.08em;
}

.speed-top{
    left:50%;
    top:12px;
    transform:translateX(-50%);
}

.speed-left{
    left:12px;
    top:50%;
    transform:translateY(-50%);
}

.speed-right{
    right:12px;
    top:50%;
    transform:translateY(-50%);
}

.speed-bottom{
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
}

.speed-center{
    width:160px;
    height:160px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
       radial-gradient(circle,
       #ed1c24,
       #96040a);

    border:6px solid white;

    box-shadow:
      0 0 40px rgba(237,28,36,.8);
}

.speed-center span{
    font-size:42px;
}

#liveCount{
    font-size:24px;
    margin-top:4px;
}

.rpm-indicator{
    width:190px;
    height:4px;

    background:#ed1c24;

    position:absolute;
    left:50%;
    top:50%;

    transform-origin:left center;

    box-shadow:0 0 15px #ed1c24;

    animation:rpmSweep 5s infinite ease-in-out;
}

@keyframes rpmSweep{
    0%{
        transform:rotate(-120deg);
    }
    50%{
        transform:rotate(120deg);
    }
    100%{
        transform:rotate(-120deg);
    }
}

@media(max-width:768px){

    .speed-ring{
        width:340px;
        height:340px;
    }

    .speed-btn{
        width:80px;
        height:80px;
    }

    .speed-center{
        width:120px;
        height:120px;
    }
}

.start-console{position:relative;z-index:1;text-align:center;width:min(760px,94vw);}
.start-title{margin-bottom:28px}.start-title .eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(237,28,36,.7);background:rgba(237,28,36,.13);border-radius:999px;padding:8px 13px;font-weight:1000;font-size:12px;letter-spacing:.14em;color:#fecaca;text-transform:uppercase}.start-title .eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--flow-red);box-shadow:0 0 14px var(--flow-red)}.start-title h1{font-size:clamp(30px,5vw,56px);line-height:1;margin:16px 0 8px;color:#fff;text-shadow:0 12px 34px rgba(0,0,0,.45)}.start-title p{margin:0;color:#b7c4d5;font-weight:800;letter-spacing:.10em;text-transform:uppercase;font-size:13px}.single-speedometer{width:min(500px,88vw);aspect-ratio:1/1;margin:0 auto;position:relative;border-radius:50%;background:radial-gradient(circle at 50% 50%,#151d2b 0 26%,#070c14 57%,#010204 100%);border:12px solid #172033;box-shadow:0 0 0 10px rgba(255,255,255,.04),inset 0 0 88px rgba(237,28,36,.28),0 32px 90px rgba(0,0,0,.55)}.single-speedometer:before{content:"";position:absolute;inset:34px;border-radius:50%;background:repeating-conic-gradient(from -140deg,#fff 0deg,#fff 2deg,transparent 2deg,transparent 8.5deg);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%);opacity:.58}.single-speedometer:after{content:"";position:absolute;inset:28px;border-radius:50%;border:10px solid transparent;border-top-color:var(--flow-red);border-right-color:var(--flow-red);transform:rotate(28deg);filter:drop-shadow(0 0 15px rgba(237,28,36,.8))}.speed-track{position:absolute;left:70px;right:70px;top:76px;height:9px;border-radius:99px;background:#1f2937;z-index:2;overflow:hidden}.speed-track i{display:block;width:72%;height:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ed1c24);box-shadow:0 0 18px rgba(237,28,36,.8)}.speed-needle{position:absolute;z-index:3;left:50%;top:50%;width:174px;height:4px;border-radius:99px;background:linear-gradient(90deg,#fff,var(--flow-red));transform-origin:left center;transform:rotate(-22deg);opacity:.68;box-shadow:0 0 16px rgba(237,28,36,.8)}.single-center{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:230px;border-radius:50%;border:8px solid #fff;background:radial-gradient(circle,#ed1c24,#b5060e 55%,#650108);box-shadow:0 0 52px rgba(237,28,36,.9),inset 0 0 28px rgba(255,255,255,.16);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.single-center .mode{font-size:16px;font-weight:1000;letter-spacing:.08em;line-height:1.1;text-transform:uppercase}.single-center .count{font-size:64px;font-weight:1000;line-height:1;margin:10px 0 2px}.single-center .unit{font-size:13px;font-weight:1000;letter-spacing:.18em}.single-center button{margin-top:16px;border:0;border-radius:999px;background:#fff;color:#991b1b;padding:13px 22px;font-size:14px;font-weight:1000;letter-spacing:.04em;box-shadow:0 12px 28px rgba(0,0,0,.28);cursor:pointer}.single-center button:hover{transform:translateY(-1px) scale(1.03)}.start-hint{margin:24px auto 0;color:#d5deeb;font-size:14px;line-height:1.5;max-width:640px}.upload-console{position:relative;z-index:1;width:min(1320px,96vw);background:rgba(255,255,255,.96);color:#08192b;border:1px solid rgba(255,255,255,.72);border-radius:28px;box-shadow:0 34px 100px rgba(0,0,0,.45);padding:26px}.upload-console-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.upload-console-head h2{margin:0;font-size:30px;color:#08192b}.upload-console-head p{margin:8px 0 0;color:#607086}.stage-pill{border-radius:999px;background:#08111d;color:#fff;padding:10px 14px;font-size:12px;font-weight:1000;letter-spacing:.10em}.upload-bay-grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px}.upload-bay{border:1px solid #cbd5e1;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 38px rgba(15,23,42,.09);position:relative}.upload-bay:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--flow-red),#fff,var(--flow-blue));}.bay-head{background:linear-gradient(135deg,#0b1118,#1b242c);color:#fff;padding:16px}.bay-code{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:1000;letter-spacing:.16em;color:#cbd5e1}.bay-led{width:10px;height:10px;border-radius:50%;background:#64748b;box-shadow:0 0 12px #64748b}.upload-bay.has-file .bay-led{background:var(--flow-green);box-shadow:0 0 14px var(--flow-green)}.bay-head b{display:block;margin-top:10px;font-size:16px;letter-spacing:.04em}.bay-body{padding:16px}.bay-body input[type=file]{width:100%;min-width:0;margin:10px 0;padding:10px;border-radius:14px;border:1px dashed #94a3b8;background:#f8fafc}.bay-file-list{font-size:12px;color:#475569;line-height:1.55;max-height:88px;overflow:auto}.file-tag{padding:4px 0}.muted-file{color:#94a3b8}.upload-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.upload-actions .btn{border-radius:14px}.upload-actions .btn.green{background:linear-gradient(135deg,#059669,#22c55e)}.upload-actions .btn.danger{background:linear-gradient(135deg,#991b1b,#ef4444)}.upload-actions .btn.secondary{background:linear-gradient(135deg,#172033,#334155);color:#fff}

<script>
// ==================== APPLICATION STATE ====================
const AppState={files:{toll:[],koike:[],line:[],line123:[]},db:null,sort:{},showAll:false,inhousePage:1,inhousePageSize:5000,koikePage:1,koikePageSize:1000};
const MAX_FILE_SIZE=1024*1024*1024;// 1GB limit
// Pre-compiled regex patterns for better performance
const REGEX_VENDOR=/YMCN|YIMM|YMVN|TYM|IYM|YMC/i;
const REGEX_CONTAINER_VENDOR=/-\s*([A-Z0-9]+)\s*-(?:\s*[A-Z]+)?\s*LINE\s*(\d+)/i;
const SAFETY_RULES={strict:true,clearPhrase:'CLEAR ALL',regeneratePhrase:'REGENERATE'};
const SAFETY_BACKUP_KEY='yamaha-inventory-latest-backup';
// ==================== UTILITY FUNCTIONS ====================
/**
 * Creates an empty database structure
 * @returns {Object} Empty database with containers, movements, lineCases arrays
 */
function emptyDB(){return{containers:[],movements:[],lineCases:[],sources:[],generatedAt:null}}
AppState.db=emptyDB();
/**
 * Shows the success modal with generation summary
 */
function showSuccessPrompt(){var s=summary();document.getElementById('successInfo').innerHTML='Records Loaded: '+fmt(s.lineCases)+'<br>Containers: '+fmt(s.containers)+'<br>Generated: '+AppState.db.generatedAt;document.getElementById('successModal').style.display='flex';}
/**
 * Closes success modal and navigates to inhouse view
 */
function closeSuccessAndView(){document.getElementById('successModal').style.display='none';show('inhouse');}
/**
 * Updates generation progress bar (used during file processing)
 * @param {number} p - Progress percentage (0-100)
 * @param {string} msg - Status message to display
 */
function updateGenProgress(p,msg){var b=document.getElementById('gpBar');var s=document.getElementById('gpStatus');var pct=document.getElementById('gpPct');if(b)b.style.width=p+'%';if(s)s.textContent=msg||'Processing';if(pct)pct.textContent=Math.round(p)+'%';}
/**
 * Shows the loading overlay with an optional message
 * @param {string} msg - Optional message to display
 */
function showLoader(msg){var o=document.getElementById("loadingOverlay");if(o){o.style.display="flex";if(msg){var t=o.querySelector(".loader-text");if(t)t.textContent=msg;}}}
/**
 * Hides the loading overlay
 */
function hideLoader(){var o=document.getElementById("loadingOverlay");if(o)o.style.display="none";}
function safetyLog(msg){var log=document.getElementById('log');if(log)log.innerHTML='<div class="notice bad"><b>Safety rule:</b> '+esc(msg)+'</div>';}
function createSafetyBackup(reason){
  if(!hasData())return true;
  try{
    localStorage.setItem(SAFETY_BACKUP_KEY,JSON.stringify({reason:reason||'manual',savedAt:new Date().toISOString(),db:AppState.db}));
    return true;
  }catch(e){
    safetyLog('Backup failed. Destructive action is blocked to protect your data.');
    return false;
  }
}
function requireSafetyConfirmation(actionLabel,phrase){
  if(!SAFETY_RULES.strict)return true;
  var input=window.prompt(actionLabel+' confirmation required. Type "'+phrase+'" to continue.','');
  if(input!==phrase){safetyLog(actionLabel+' cancelled. Confirmation text did not match.');return false;}
  return true;
}
// Global error handler
window.addEventListener('error',function(e){var log=document.getElementById('log');if(log){log.innerHTML='<div class="notice bad"><b>Script error:</b> '+(e.message||'Unknown error')+'</div>';}});
/**
 * Checks if there is any loaded data
 * @returns {boolean} True if database contains data
 */
function hasData(){return AppState.db.containers.length+AppState.db.movements.length+AppState.db.lineCases.length>0}
// KOIKE detail cases share the import store, but are not In-House inventory.
function inhouseCaseRows(){return AppState.db.lineCases.filter(function(row){return row.warehouse!=='Koike';});}
function fmt(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clean(x){return String(x??'').trim()}
function num(x){return Number(String(x??'0').replace(/,/g,''))||0}
function norm(x){return clean(x).toLowerCase().replace(/\s+/g,' ')}
function getBaseModel(full){
  if(!full)return '';

  let txt=String(full).trim().toUpperCase();

  let firstPart=txt.split(/\s+/)[0];
  firstPart=firstPart.split('-')[0];

  // Convert BFA4, BFA5, BFA6 -> BFA
  let match=firstPart.match(/^([A-Z]+)\d$/);

  if(match){
    return match[1];
  }

  return firstPart.trim();
}
function dval(x){return clean(x)}
function fileKey(f){return [f.name,f.size,f.lastModified].join('|')}
function ensureXLSX(){
  return new Promise(function(resolve,reject){
    if(window.XLSX){
      resolve();
      return;
    }

    var log=document.getElementById('log');
    if(log){
      log.innerHTML=
        '<div class="parser-loader">'+
        '<div class="parser-pulse">Preparing Inventory Engine</div>'+
        '<div style="font-size:13px;color:#64748b">Loading Excel Processing Library (XLSX Parser)</div>'+
        '<div class="parser-bar"><div class="parser-fill"></div></div>'+
        '<div style="font-size:12px;color:#64748b;margin-top:8px">Please wait while the inventory engine initializes...</div>'+
        '</div>';
    }

    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    sc.onload=function(){resolve()};
    sc.onerror=function(){
      reject(new Error('Excel parser could not load. Please check internet access or open this HTML in Edge/Chrome.'));
    };
    document.head.appendChild(sc);
  });
}

/**
 * Sets files for a given type with validation
 * @param {FileList} list - Files to upload
 * @param {string} type - File type category (toll, koike, line, line123)
 */
function setFiles(list,type){
  let incoming=Array.from(list||[]);

  let oversized=incoming.filter(f=>f.size>MAX_FILE_SIZE).map(f=>f.name);
  if(oversized.length>0){
    var log=document.getElementById('log');
    if(log){
      log.innerHTML='<div class="notice bad"><b>File size error:</b> '+oversized.join(', ')+' exceed 1GB limit. Please use smaller files.</div>';
    }
    return;
  }

  if(type==='line'||type==='line123'){
    let seen=new Set(AppState.files[type].map(fileKey));
    incoming.forEach(function(f){
      if(!seen.has(fileKey(f))){
        AppState.files[type].push(f);
        seen.add(fileKey(f));
      }
    });
  }else{
    AppState.files[type]=incoming;
  }

  renderUpload();
}
function removeLineFile(type,i){AppState.files[type].splice(i,1);renderUpload()}
function clearType(type){AppState.files[type]=[];renderUpload()}
function noData(t){return`<div class="empty"><div><h2>${t}</h2><p class="hint">Upload the reports and click <b>Generate Inventory</b>. No uploaded data is displayed before generation.</p><button class="btn" onclick="show('upload')">Go to Upload</button></div></div>`}
function show(v){

    document.querySelectorAll('[data-v]')
    .forEach(btn=>{

        btn.classList.remove('active');

        if(btn.dataset.v===v){
            btn.classList.add('active');
        }

    });

    document.querySelectorAll('.view')
    .forEach(view=>{
        view.hidden=true;
    });

    const page=document.getElementById(v);

    if(page){
        page.hidden=false;
    }

}
document.getElementById('nav').addEventListener('click', function(e){

    const btn = e.target.closest('[data-v]');

    if(!btn) return;

    show(btn.dataset.v);

});function renderUpload(){let f=t=>AppState.files[t].map((x,i)=>(t==='line'||t==='line123')?`${esc(x.name)} <button class="btn secondary mini" onclick="removeLineFile('${t}',${i})">Remove</button>`:esc(x.name)).join('<br>')||'No file selected';document.getElementById('upload').innerHTML=`<div class="panel"><div style="display:flex;align-items:center;gap:14px;margin-bottom:16px"><img src="yamaha-badge.png" alt="Yamaha badge" style="width:44px;height:44px;display:block;border-radius:50%;border:1px solid #d8e0ea;background:#fff;object-fit:cover"><h2 style="margin:0">Upload & Generate Inventory</h2></div><div class="notice ok">Upload Excel Report from Line 4, Line 1,2,3 , KOIKE & Toll Global</div><div class="grid3"><div class="drop"><b>Toll Global IN/OUT</b><p class="hint">Sheets: INBOUND and OUTBOUND.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'toll')"><p class="hint">${f('toll')}</p></div><div class="drop"><b>Koike Incoming</b><p class="hint">Visible monthly sheets only. Hidden sheets are skipped.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'koike')"><p class="hint">${f('koike')}</p></div><div class="drop"><b>In-House Line 4</b><p class="hint">Multiple upload is enabled. Add Line 4 files such as YIMM, YMVN, TYM together or one by one.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'line');this.value=''"><div class="toolbar" style="margin:8px 0"><button class="btn secondary" onclick="clearType('line')">Clear Line 4 files</button></div><p class="hint"><b>Selected Line 4 files:</b><br>${f('line')}</p></div><div class="drop"><b>In-House Line 1,2,3</b><p class="hint">Upload Instant Warehouse Record files. Vendor is detected from filename/header: YIMM, VIETNAM/YMVN, TYM, INDIA/IYM, or CKD/YMC. These records appear as Line 1,2,3.</p><input type="file" multiple accept=".xlsx,.xls,.csv" onchange="setFiles(this.files,'line123');this.value=''"><div class="toolbar" style="margin:8px 0"><button class="btn secondary" onclick="clearType('line123')">Clear Line 1,2,3 files</button></div><p class="hint"><b>Selected Line 1,2,3 files:</b><br>${f('line123')}</p></div></div><div class="toolbar"><button class="btn green" onclick="generate()">Generate Inventory</button><button class="btn danger" onclick="clearAll()">Clear</button><button class="btn secondary" onclick="exportJSON()">Export JSON</button></div><div id="log" class="hint"></div><noscript><div class="notice bad">JavaScript is blocked. Download the HTML and open locally in Microsoft Edge or Chrome.</div></noscript></div>`}


/**
 * Repairs Line 4 marking numbers that combine Order No and Colour Code in one cell.
 * Example: "BGEEB0 / A6-010A" -> Order No = BGEEB0, Colour Code = A6-010A.
 */
function repairLine4SlashOrderColour(){
  if(!AppState || !AppState.db || !Array.isArray(AppState.db.lineCases))return;
  AppState.db.lineCases.forEach(function(row){
    if(!row || row.line !== 'Line 4')return;
    var mark = clean(row.markingNo || row.modelName || '');
    if(!mark || mark.indexOf('/') < 0)return;
    var parts = mark.split('/').map(function(p){return clean(p).toUpperCase();}).filter(Boolean);
    if(parts.length < 2)return;
    var left = parts[0], right = parts[1];
    var leftLooksOrder = /^[A-Z][A-Z0-9]{4,9}$/.test(left) && !/^[A-Z]{1,3}\d?\s*-\s*\d{3}[A-Z0-9]*$/.test(left);
    var rightLooksColour = /^[A-Z0-9]{1,4}\s*-\s*\d{3}[A-Z0-9]*$/.test(right);
    if(leftLooksOrder){
      row.orderNo = left;
      if(clean(row.modelName).toUpperCase() === mark.toUpperCase())row.modelName = '';
    }
    if(rightLooksColour){
      row.colourCode = right.replace(/\s+/g,'');
    }
  });
}

async function generate(){
  showLoader("Generating inventory from uploaded files...");
  try{await ensureXLSX()}catch(e){document.getElementById('log').innerHTML='<div class="notice bad"><b>Excel parser not loaded:</b> '+e.message+'</div>';hideLoader();return}
  if(!AppState.files.toll.length&&!AppState.files.koike.length&&!AppState.files.line.length&&!AppState.files.line123.length){document.getElementById('log').innerHTML='<div class="notice bad">Select at least one report file.</div>';hideLoader();return}
  if(hasData()){
    if(!requireSafetyConfirmation('Regenerate inventory',SAFETY_RULES.regeneratePhrase)){hideLoader();return}
    if(!createSafetyBackup('regenerate')){hideLoader();return}
  }
  AppState.db=emptyDB();AppState.sort={};AppState.showAll=false;
  let msgs=[];let total=['toll','koike','line','line123'].reduce((a,t)=>a+AppState.files[t].length,0);let done=0;
  for(let type of ['toll','koike','line','line123'])for(let file of AppState.files[type]){
    updateGenProgress((done/Math.max(total,1))*100,'Reading '+file.name);
    try{
      let r=await readWorkbook(file,type);
      msgs.push(`${file.name}: ${r.containers} containers, ${r.movements} movements, ${r.lineCases} in-house cases${r.hidden?`, ${r.hidden} hidden sheet(s) skipped`:''}`);
      AppState.db.sources.push(file.name);done++;updateGenProgress((done/Math.max(total,1))*100,'Processed '+file.name)
    }catch(e){msgs.push(`${file.name}: ERROR ${e.message}`)}
  }
  AppState.db.generatedAt=new Date().toLocaleString();
  repairLine4SlashOrderColour();
renderAll();

if(document.getElementById('liveCount')){
    document.getElementById('liveCount').innerText =
        AppState.db.lineCases.length.toLocaleString();
}

hideLoader();
show('inhouse');
  let log=document.getElementById('log');if(log)log.innerHTML='<div class="notice ok"><b>Generated.</b><br>'+msgs.map(esc).join('<br>')+'</div>'
}
function readWorkbook(file,type){return new Promise((res,rej)=>{let fr=new FileReader();fr.onerror=()=>rej(new Error('cannot read file'));fr.onload=e=>{try{let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});let out={containers:0,movements:0,lineCases:0,hidden:0};wb.SheetNames.forEach((name,i)=>{let meta=wb.Workbook&&wb.Workbook.Sheets?wb.Workbook.Sheets[i]:null;if(meta&&meta.Hidden){out.hidden++;return}let rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false});let x=transform(rows,type,name,file.name);AppState.db.containers.push(...x.containers);AppState.db.movements.push(...x.movements);AppState.db.lineCases.push(...x.lineCases);out.containers+=x.containers.length;out.movements+=x.movements.length;out.lineCases+=x.lineCases.length});res(out)}catch(err){rej(err)}};fr.readAsArrayBuffer(file)})}
function findHeader(rows,words){for(let i=0;i<Math.min(rows.length,30);i++){let j=rows[i].join('|').toLowerCase();if(words.every(w=>j.includes(w.toLowerCase())))return i}return 0}
function idx(h,names){for(let nm of names){let j=h.findIndex(x=>x.includes(norm(nm)));if(j>=0)return j}return -1}
/**
 * Checks if a date value is in the future (with error handling)
 * @param {*} v - Value to check
 * @returns {boolean} True if date is in the future
 */
function isFutureDate(v){
  if(!v)return false;
  try{
    let d=new Date(v);
    return !isNaN(d) && d>new Date();
  }catch(e){
    return false;
  }
}

/**
 * Parses inventory date from multiple formats with error handling
 * @param {string} v - Date string to parse
 * @returns {Date|null} Parsed date or null if invalid
 */
function parseInventoryDate(v){
  v=clean(v);
  if(!v)return null;
  try{
    // Excel serial date (e.g. 45567)
    if(/^\d{5}(?:\.\d+)?$/.test(v)){
      let serial=Number(v);
      if(!isNaN(serial)){
        let excelEpoch=new Date(Date.UTC(1899,11,30));
        let d=new Date(excelEpoch.getTime()+Math.floor(serial)*86400000);
        return isNaN(d)?null:d;
      }
    }
    // Reject plain integers like "1" to avoid false-positive date parsing.
    if(/^\d+$/.test(v))return null;
    let m=v.match(/^(\d{1,2})[\.\/\-](\d{1,2})[\.\/\-](\d{4})$/);
    if(m){
      let d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
      return isNaN(d)?null:d;
    }
    m=v.match(/^(\d{4})[\.\/\-](\d{1,2})[\.\/\-](\d{1,2})$/);
    if(m){
      let d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
      return isNaN(d)?null:d;
    }
    // e.g. 18-Dec, 18-Dec-24, 18 Dec 2024
    m=v.match(/^(\d{1,2})[\s\-\/\.]([A-Za-z]{3,9})(?:[\s\-\/\.](\d{2,4}))?$/);
    if(m){
      let y=m[3]?Number(m[3]):new Date().getFullYear();
      if(y<100)y+=2000;
      let d=new Date(`${m[1]} ${m[2]} ${y}`);
      return isNaN(d)?null:d;
    }
    // Guard generic parser: require date-like separators or month words.
    if(!(/[A-Za-z]/.test(v)||/[\/\-.]/.test(v)))return null;
    let d=new Date(v);
    return isNaN(d)?null:d;
  }catch(e){
    return null;
  }
}
function isPastInventoryDate(v){
  let d=parseInventoryDate(v);
  if(!d)return false;
  let today=new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return d<today;
}
function normalizeInhouseCaseNo(v){
  let s=clean(v).replace(/^'/,'').replace(/\s+/g,'');
  if(/^\d+(?:\.0+)?$/.test(s))s=String(Math.trunc(Number(s)));
  if(/^\d+$/.test(s))s=s.padStart(6,'0');
  return /^\d{6}$/.test(s)?s:'';
}
function pad3Numeric(v){
  let s=clean(v).replace(/\s+/g,'');
  if(!s)return '';
  if(/^\d+(?:\.0+)?$/.test(s))return String(Math.trunc(Number(s))).padStart(3,'0');
  return '';
}
function splitInhouseModelCodes(row){
  let modelRaw=clean(row.modelFull||row.modelName).toUpperCase();
  let setRaw=clean(row.endCode).toUpperCase();
  let colourRaw=clean(row.colourCode).toUpperCase();
  let markRaw=clean(row.markingNo).toUpperCase();

  function normalizeToken(v,allowDash){
    return clean(v).toUpperCase().replace(allowDash?/[^A-Z0-9-]/g:/[^A-Z0-9]/g,'');
  }
  function isColourToken(v){
    return /^\d{3}[A-Z0-9-]*$/.test(normalizeToken(v,true));

    .map(function(x){return clean(x).toUpperCase().replace(/[^A-Z0-9]/g,'');})
    .filter(Boolean);

    let grouped={};

      let model=clean(r.model);

      let vendor=clean(r.vendor).toUpperCase();
      let orderNo=clean(r.orderNo||r.markNo).toUpperCase();
      let setCode=clean(r.setCode).toUpperCase();
      let colourCode=clean(r.colourCode).toUpperCase();
      // Packing standards can vary by set and colour within the same model.
      let standardKey=[vendor,model.toUpperCase(),setCode,colourCode].join('|');
      // A reused lot/case number is only the same physical lot when its vendor,
      // order, set code and colour code also match.
      let key=[standardKey,orderNo,lot.toUpperCase()].join('|');

      // rather than accidentally merging several unnumbered rows into one case.
      if(!caseId)caseId='__row_'+index;

      // counted as still available.
      if(!previous||status==='Used')grouped[key].cases.set(caseId,status);

    let lot=standardLots[key],count=lot.cases.size;
    if(!modelCaseCounts[lot.standardKey])modelCaseCounts[lot.standardKey]={};

  });

}

function renderInhouse(){

  if(!hasData()){
    el.innerHTML=noData('In-house cases empty until generated');
    return;
  }

  let baseRows=collapseInhouseRows(inhouseCaseRows().map(normalizeInhouseDisplayRow));

  let v   = AppState.filters.v || '';
  let ln  = AppState.filters.ln || '';
  let st  = AppState.filters.st || '';
  let ord = AppState.filters.ord || '';
  let cas = AppState.filters.cas || '';

  function applySelected(rows,skip){
    if(skip!=='baseModel' && bm){
      rows=rows.filter(x=>getBaseModel(x.modelFull)===bm);
    }

    if(skip!=='modelFull' && m){
      rows=rows.filter(x=>x.modelFull===m);
    }

    if(skip!=='vendor' && v){
      rows=rows.filter(x=>x.vendor===v);
    }

    if(skip!=='line' && ln){
      rows=rows.filter(x=>x.line===ln);
    }

    if(skip!=='orderNo' && ord){
      rows=rows.filter(x=>x.orderNo===ord);
    }

    if(skip!=='caseNo' && cas){
      rows=rows.filter(x=>x.caseNo===cas);
    }

    if(skip!=='status' && st){
      rows=rows.filter(x=>x.status===st);
    }

    return rows;
  }

  function statusList(rows){
    let has=new Set(rows.map(x=>x.status).filter(Boolean));
    return ['In Stock','Used','Not Received'].filter(x=>has.has(x));
  }

  function baseModelList(rows){
    return [
      ...new Set(
        rows
          .map(x=>getBaseModel(x.modelFull))
          .filter(Boolean)
      )
    ].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
  }

    AppState.filters.q=q;

    AppState.filters.m=m;

    AppState.filters.ln=ln;
    AppState.filters.st=st;
    AppState.filters.ord=ord;
    AppState.filters.cas=cas;
  }

  function normalizeFilters(){
    for(let i=0;i<8;i++){
      let changed=false;

        bm='';
        m='';
        changed=true;

      if(m && !models.includes(m)){
        m='';
        changed=true;
      }

        v='';
        changed=true;

        ln='';
        changed=true;
      }

      let orders=unique(applySelected(baseRows,'orderNo'),'orderNo');

        ord='';
        changed=true;
      }

      let cases=unique(applySelected(baseRows,'caseNo'),'caseNo');

        cas='';
        changed=true;
      }

      let statuses=statusList(applySelected(baseRows,'status'));
      if(st && !statuses.includes(st)){
        st='';
        changed=true;
      }

      if(!changed)break;
    }

    syncFiltersToState();
  }

  let baseModelOptions=baseModelList(applySelected(baseRows,'baseModel'));

    ? unique(applySelected(baseRows,'modelFull'),'modelFull')
    : [];

  let lineOptions=unique(applySelected(baseRows,'line'),'line');
  let orderOptions=unique(applySelected(baseRows,'orderNo'),'orderNo');
  let caseOptions=unique(applySelected(baseRows,'caseNo'),'caseNo');
  let statusOptions=statusList(applySelected(baseRows,'status'));

  let summaryRows=filter(applySelected(baseRows,'status'),q);

    AppState.inhousePage=1;

  let pageRows=rows.slice(start,start+AppState.inhousePageSize);

    </div>

      filteredActive
      ?
      t(pageRows,[
        {k:'status',l:'Status',f:pill},
        {k:'vendor',l:'Vendor'},
        {k:'line',l:'Line'},
        {k:'modelFull',l:'Model'},
        {k:'orderNo',l:'Order No'},
        {k:'endCode',l:'Set Code'},

          <h2>Select a filter to list data</h2>

    }

function getInhouseFiltered(){
  let q   = AppState.filters.q || '';
  let bm  = AppState.filters.bm || '';
  let m   = AppState.filters.m || '';
  let v   = AppState.filters.v || '';
  let ln  = AppState.filters.ln || '';
  let st  = AppState.filters.st || '';
  let ord = AppState.filters.ord || '';
  let cas = AppState.filters.cas || '';

  let rows=collapseInhouseRows(inhouseCaseRows().map(normalizeInhouseDisplayRow));

  if(bm){
    rows=rows.filter(x=>getBaseModel(x.modelFull)===bm);
  }

  if(m){
    rows=rows.filter(x=>x.modelFull===m);
  }

  if(v){
    rows=rows.filter(x=>x.vendor===v);
  }

  if(ln){
    rows=rows.filter(x=>x.line===ln);
  }

  if(ord){
    rows=rows.filter(x=>x.orderNo===ord);
  }

  if(cas){
    rows=rows.filter(x=>x.caseNo===cas);
  }

  if(st){
    rows=rows.filter(x=>x.status===st);
  }

  return filter(rows,q);
}

AppState.flow='start';
function setFlow(mode){
  AppState.flow=mode;
  document.body.classList.remove('flow-start','flow-upload','flow-app');
  document.body.classList.add('flow-'+mode);
}
function updateStartCounts(){
  var c=(AppState.db&&AppState.db.lineCases?AppState.db.lineCases.length:0).toLocaleString();
  ['startCaseCount','liveCount'].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=c;});
}
function playScreenTransition(e,callback){
  var overlay=document.getElementById('flowTransition');
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!overlay||reduced){callback();return;}
  var ox='50%',oy='50%';
  if(e&&typeof e.clientX==='number'&&window.innerWidth){
    ox=(e.clientX/window.innerWidth*100).toFixed(1)+'%';
    oy=(e.clientY/window.innerHeight*100).toFixed(1)+'%';
  }
  overlay.style.setProperty('--ox',ox);
  overlay.style.setProperty('--oy',oy);
  overlay.style.display='block';
  void overlay.offsetWidth;
  overlay.classList.add('covering');
  setTimeout(function(){
    callback();
    setTimeout(function(){
      overlay.classList.remove('covering');
      setTimeout(function(){overlay.style.display='none';},450);
    },40);
  },420);
}
function swapToUploadBays(){
  setFlow('upload');
  show('upload');
  renderUpload();
  updateStartCounts();
}
function openUploadBays(e){
  playScreenTransition(e,swapToUploadBays);
}
function backToSpeedometer(e){
  playScreenTransition(e,function(){
    setFlow('start');
    renderUpload();
    updateStartCounts();
  });
}
if(document.addEventListener){
  document.addEventListener('click',function(e){

  });
}
function fileListHtml(type){
  var list=AppState.files[type]||[];
  if(!list.length)return '<span class="muted-file">No file selected</span>';
  return list.map(function(f,i){
    var remove=(type==='line'||type==='line123')?' <button class="btn secondary mini" onclick="removeLineFile(\''+type+'\','+i+')">Remove</button>':'';
    return '<div class="file-tag">'+esc(f.name)+remove+'</div>';
  }).join('');
}
function uploadBay(code,title,desc,type,clearText){

// ==================== FINAL PROGRESS-SYNC LOADER ====================
(function(){
  function clampPct(p){
    p = Number(p);
    if(!isFinite(p))p = 0;
    return Math.max(0, Math.min(100, p));
  }
  function cleanLoaderTitle(){
    var title=document.querySelector('#loadingOverlay .loader-title');
    if(title)title.textContent='PROCESSING INVENTORY DATA';
  }
  function syncLoaderToPercent(p,msg){
    var pct = clampPct(p);
    var overlay=document.getElementById('loadingOverlay');
    if(!overlay)return;
    var bar=overlay.querySelector('.loader-bar');
    if(!bar)return;
    bar.style.setProperty('--loader-progress', pct + '%');
    var fill=bar.querySelector('.loader-fill');
    if(fill){
      fill.style.animation='none';
      fill.style.clipPath='none';
      fill.style.transform='none';
      fill.style.width=pct + '%';
    }
    var bike=bar.querySelector('.loader-bike');
    if(bike){
      var half=Math.max(18, Math.round((bike.offsetWidth||46)/2));
      bike.style.animation='none';
      bike.style.left='calc(' + pct + '% - ' + half + 'px)';
      bike.style.transform='translateY(0) rotate(' + (pct >= 100 ? '0' : '-1') + 'deg)';
    }
    var label=bar.querySelector('.loader-speed-label');
    if(label)label.textContent='RACE ' + Math.round(pct) + '%';
    var text=overlay.querySelector('.loader-text');
    if(text && msg)text.textContent=msg + ' • ' + Math.round(pct) + '%';
    cleanLoaderTitle();
  }

  var oldShowLoaderSync = showLoader;
  showLoader = function(msg){
    oldShowLoaderSync(msg);
    setTimeout(function(){syncLoaderToPercent(0,msg||'Starting inventory generation');},0);
  };

  var oldUpdateGenProgressSync = updateGenProgress;
  updateGenProgress = function(p,msg){
    oldUpdateGenProgressSync(p,msg);
    syncLoaderToPercent(p,msg);
  };

  window.syncLoaderToPercent = syncLoaderToPercent;
})();
// ==================== END FINAL PROGRESS-SYNC LOADER ====================

</script>
